defaultNamespace: cattle-monitoring-system
helm:
  releaseName: rancher-monitoring
  chart: rancher-monitoring
  repo: https://charts.rancher.io
  values:
    grafana:
      grafana.ini:
        auth.anonymous:
          org_role: Admin
      sidecar:
        dashboards:
          searchNamespace: ALL
    global:
      cattle:
        clusterId: "${ .ClusterLabels.'clusterId' }"
        clusterName: "${ .ClusterLabels.'clusterName' }"
    rke2ControllerManager:
      enabled: true
    rke2Etcd:
      enabled: true
    rke2Proxy:
      enabled: true
    rke2Scheduler:
      enabled: true
    rke2IngressNginx:
      enabled: true
    prometheus:
      prometheusSpec:
        serviceMonitorSelector:
          matchLabels:
            release: rancher-monitoring
        serviceMonitorSelectorNilUsesHelmValues: true
