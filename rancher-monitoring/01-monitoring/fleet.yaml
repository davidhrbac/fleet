defaultNamespace: cattle-monitoring-system
helm:
  releaseName: rancher-monitoring
  chart: rancher-monitoring
  repo: https://charts.rancher.io
  values:
    global:
      cattle:
        clusterId: c-m-78zzq4bw
        clusterName: test
        url: https://rancher-dbops.int.tietoevry.com
    prometheus:
      rke2ControllerManager:
        enabled: true
      rke2Etcd:
        enabled: true
      rke2Proxy:
        enabled: true
      rke2Scheduler:
        enabled: true
      rke2IngressNginx:
        enabled: true
      prometheusSpec:
        serviceMonitorSelector:
          matchLabels:
            release: rancher-monitoring
        serviceMonitorSelectorNilUsesHelmValues: true
